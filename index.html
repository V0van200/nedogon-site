<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEDOGONPOLYA — скоро</title>
<meta name="description" content="Сайт стримерши NEDOGONPOLYA скоро будет здесь. А пока — стримы на Twitch.">
<style>
:root{--bg:#0d0d0f;--fg:#f2efe9;--muted:#a19c93;--accent:#ff5a36;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:grid;place-items:center;padding:24px}
main{max-width:640px;width:100%}
.tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid #2a2a2e;border-radius:999px;padding:6px 12px}
h1{font-size:clamp(40px,11vw,88px);line-height:.95;margin:22px 0 14px;letter-spacing:-.02em;font-weight:800}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:clamp(16px,2.6vw,19px);margin:0 0 28px;max-width:46ch}
a.btn{display:inline-flex;gap:10px;align-items:center;background:var(--accent);color:#120806;font-weight:700;text-decoration:none;padding:14px 22px;border-radius:12px}
a.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
footer{margin-top:40px;font-size:13px;color:#6f6a63}
</style>
</head>
<body>
<main>
  <span class="tag">сайт в разработке</span>
  <h1>NEDOGON<span>POLYA</span></h1>
  <p>Скоро здесь будет сайт. А пока — стримы на Twitch: спорт, путешествия, активный отдых, Dota&nbsp;2 с чатом и душевные разговоры.</p>
  <a class="btn" href="https://www.twitch.tv/nedogonpolya" rel="noopener">Смотреть на Twitch →</a>
  <footer>nedogon-polya.ru</footer>
</main>
</body>
</html>
